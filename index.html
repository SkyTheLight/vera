<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>V.E.R.A. — Vehicle Enterprise Rental Assistant</title>
  <meta name="description" content="V.E.R.A. vehicle rental management system">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

<link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css">

<link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/flatpickr/dist/plugins/confirmDate/confirmDate.css">
</head>
<body>
  <div id="app" class="app-shell">
    <header id="topbar" class="topbar hidden">
      <div class="topbar-inner">
        <div class="topbar-left">
          <a href="#/" class="brand" onclick="App.goHome(event)">
            <span class="brand-mark">V</span>
            <span class="brand-text">
              <span class="brand-name">V.E.R.A.</span>
              <span class="brand-sub">Vehicle Enterprise Rental Assistant</span>
            </span>
          </a>
        </div>
        <div class="topbar-right">
          <div class="role-switch" role="group" aria-label="Switch view">
            <button id="roleBtnCustomer" type="button" class="role-btn" onclick="App.switchRole('customer')">Customer</button>
            <button id="roleBtnAdmin" type="button" class="role-btn" onclick="App.switchRole('admin')">Admin</button>
          </div>
          <div class="notif-wrap">
            <a
                id="accountBtn"
                href="#/customer/history"
                class="account-btn hidden"
                aria-label="My account"
            >
                <svg
                    width="20"
                    height="20"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                >
                    <circle cx="12" cy="12" r="10"/>
                    <circle cx="12" cy="9" r="3"/>
                    <path d="M5.5 19a6.5 6.5 0 0 1 13 0"/>
                </svg>

                <span>Account</span>
            </a>
            <button id="notifBtn" type="button" class="icon-btn" onclick="App.toggleNotifications(event)" aria-label="Notifications">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 17h5l-1.4-1.4A2 2 0 0 1 18 14.2V11a6 6 0 1 0-12 0v3.2c0 .53-.21 1.04-.59 1.41L4 17h5"/><path d="M9 17a3 3 0 0 0 6 0"/></svg>
              <span id="notifBadge" class="notif-badge hidden">0</span>
            </button>
            <div id="notifDropdown" class="notif-dropdown hidden" aria-label="Notifications panel">
              <div class="notif-header">
                <span class="notif-title">Notifications</span>
                <button type="button" class="link-btn" onclick="App.markAllRead()">Mark all read</button>
              </div>
              <div id="notifList" class="notif-list"></div>
              <div class="notif-footer"><a id="notifViewAll" href="#/customer/notifications" class="link-btn">View all</a></div>
            </div>
          </div>
        </div>
      </div>
    </header>

    <div class="app-body">
      <aside id="sidebar" class="sidebar hidden">
        <nav id="sidebarNav" class="side-nav" aria-label="Primary"></nav>
      </aside>
      <main id="main" class="main">
        <div id="appRoot" class="page"></div>
      </main>
    </div>

    <nav id="bottomNav" class="bottom-nav hidden" aria-label="Primary">
      <div id="bottomNavInner" class="bottom-nav-inner"></div>
    </nav>
  </div>

  <div id="modalRoot"></div>
  <div id="toastContainer" class="toast-container" aria-live="polite"></div>

  <script src="data.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/plugins/confirmDate/confirmDate.js"></script>
  <script src="app.js"></script>
  <script src="assistant.js"></script>
  <script src="tracking.js"></script>
</body>
</html>
